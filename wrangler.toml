name = "kiro-community-worker"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "repo.giovannimetitieri.it"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.issues]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 0.1
